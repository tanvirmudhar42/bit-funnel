[package]
name = "bitfunnel"
version = "0.2.0"
edition = "2021"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "test_substring"
path = "examples/test_substring.rs"

[[example]]
name = "test_and_order"
path = "examples/test_and_order.rs"

[[example]]
name = "index_postgres"
path = "examples/index_postgres.rs"

[[example]]
name = "index_s3"
path = "examples/index_s3.rs"

[[example]]
name = "persistence"
path = "examples/persistence.rs"

[[bin]]
name = "bitfunnel-cli"
path = "src/cli.rs"

[[bin]]
name = "generate-fixtures"
path = "src/generate_fixtures.rs"

[features]
default = ["rayon"]
rayon = ["dep:rayon"]
tokio-parallel = ["tokio/rt-multi-thread", "dep:num_cpus"]
postgres = ["dep:sqlx"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]

[dependencies]
bitvec = { version = "1.0", features = ["serde"] }
rayon = { version = "1.10", optional = true }
num_cpus = { version = "1.0", optional = true }
twox-hash = "2.1"
axum = { version = "0.8", features = ["ws"] }
actix-web = "4"
actix-ws = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
anyhow = "1.0"
thiserror = "2.0"
crossterm = "0.29"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls"], optional = true }
aws-config = { version = "1.1", optional = true }
aws-sdk-s3 = { version = "1.17", optional = true }
