[package]
name = "bitfunnel"
version = "0.1.0"
edition = "2021"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "test_substring"
path = "examples/test_substring.rs"

[[example]]
name = "test_and_order"
path = "examples/test_and_order.rs"

[[bin]]
name = "bitfunnel-cli"
path = "src/cli.rs"

[[bin]]
name = "generate-fixtures"
path = "src/generate_fixtures.rs"

[dependencies]
bitvec = "1.0"
rayon = "1.10"
twox-hash = "1.6"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1.0"
thiserror = "1.0"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.27"

