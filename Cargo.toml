[package]
name = "bitfunnel"
version = "0.1.0"
edition = "2021"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "test_substring"
path = "examples/test_substring.rs"

[[example]]
name = "test_and_order"
path = "examples/test_and_order.rs"

[[bin]]
name = "bitfunnel-cli"
path = "src/cli.rs"

[[bin]]
name = "generate-fixtures"
path = "src/generate_fixtures.rs"

[features]
default = ["rayon"]
rayon = ["dep:rayon"]
tokio-parallel = ["tokio/rt-multi-thread", "dep:num_cpus"]

[dependencies]
bitvec = "1.0"
rayon = { version = "1.10", optional = true }
num_cpus = { version = "1.0", optional = true }
twox-hash = "1.6"
axum = { version = "0.7", features = ["ws"] }
actix-web = "4"
actix-ws = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
anyhow = "1.0"
thiserror = "1.0"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.27"

